name: Daily custody snapshot

# Saves the Daily Inmates In Custody count every day. A missed day cannot be
# recovered later, so this runs daily even though the page updates weekly.
on:
  schedule:
    - cron: "23 22 * * *"   # 5:23 p.m. New York (winter), after Open Data's daily refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jails-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Save today's snapshot
        run: Rscript R/snapshot.R
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Custody snapshot $(date -u +%F)" || exit 0
          git pull --rebase
          git push
